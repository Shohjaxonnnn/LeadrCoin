<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Orzu Mobile — YO‘Q reel</title>
<link rel="stylesheet" href="../../kit.css">
</head>
<body>
<div id="stage"></div>
<script src="timing.js"></script>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../kit.js"></script>
<script>
/* v1 · "YO‘Q": NASIYA → 4× YO‘Q! → PASPORT + KARTA → SOVG‘A → CTA */
makeReel(({SC, tl, el, ICON, mkPhone, passportHTML, cardHTML, makeBlock, blockIn, slamIn, art, glowDisc, icon, strikeOver, strikeAt, tag, ctaScene}) => {

/* S1 — hook: "NASIYA — yashirin to‘lovlar bormi?" */
{
  const sc = SC[0], {t0, vs} = sc;
  const a = art(sc.el, true);
  const ph = mkPhone('p1', 390, 330, 1.05); a.appendChild(ph);
  const d = glowDisc(a, 190, 360, 700);
  const b = makeBlock(sc.el,{hl:'NASIYA', label:'yashirin to‘lovlar bormi?', maxW:900});
  tl.fromTo(ph,{y:420,rotationY:-70,rotationZ:-24,scale:.6,opacity:0},{y:0,rotationY:-16,rotationZ:-10,scale:1.05,opacity:1,duration:1.0,ease:'expo.out'}, t0+.05);
  tl.to(ph,{rotationY:22,rotationZ:9,y:-26,duration:2.4,ease:'sine.inOut'}, t0+.5);
  tl.fromTo(d,{scale:.3,opacity:0},{scale:1,opacity:1,duration:.9,ease:'power3.out'}, t0+.05);
  blockIn(b, vs-.05, {labelAt: vs+.85});                       // headline on "Nasiya", label on "yashirin to‘lovlar…"
}

/* S2..S5 — question first (label), then "YO‘Q!" slams exactly on the spoken word */
[
  { sc:SC[1], icon:'wallet',   label:'boshlang‘ich to‘lov', n:1 },
  { sc:SC[2], icon:'percent',  label:'foiz va ortiqcha to‘lov', n:2 },
  { sc:SC[3], icon:'calendar', label:'kechiksangiz jarima', n:3 },
  { sc:SC[4], icon:'cloud',    label:'iCloud bloklash', n:4 },
].forEach(o=>{
  const {t0, vs, slam} = o.sc;
  const a = art(o.sc.el);
  const d = glowDisc(a, 170, 380, 740);
  const ic = icon(a, o.icon, 290, 500);
  const st = strikeOver(a, 290, 500);
  const chip = el('div','chip', `0${o.n} <em>/ 04</em>`); a.appendChild(chip);
  const b = makeBlock(o.sc.el,{hl:'YO‘Q!', label:o.label, maxW:900, maxFont:290});
  tl.fromTo(d,{scale:.2,opacity:0},{scale:1,opacity:1,duration:.5,ease:'power3.out'}, t0);
  tl.fromTo(ic,{scale:.2,rotation:-25,opacity:0},{scale:1,rotation:0,opacity:1,duration:.5,ease:'back.out(2.4)'}, t0+.04);
  tl.to(ic,{y:-16,duration:1.0,yoyo:true,repeat:1,ease:'sine.inOut'}, t0+.5);
  tl.fromTo(chip,{x:-60,opacity:0},{x:0,opacity:1,duration:.4,ease:'power3.out'}, t0+.08);
  strikeAt(st, slam);
  tl.fromTo(ic,{opacity:1},{opacity:.35,duration:.2}, slam-.05);
  slamIn(b, slam, {labelAt: vs});
});

/* S6 — "Faqat pasport va karta kerak." */
{
  const sc = SC[5], {t0, vs} = sc;
  const a = art(sc.el);
  const d = glowDisc(a, 140, 420, 800);
  const pass = el('div','glowsvg',passportHTML(),{position:'absolute',left:'210px',top:'470px',width:'260px',height:'360px',transformOrigin:'50% 100%'});
  const card = el('div','glowsvg',cardHTML(),{position:'absolute',left:'430px',top:'660px',width:'400px',height:'250px',transformOrigin:'0 100%'});
  a.append(pass, card);
  const t20 = tag(a,'20 yoshdan',250,1010), t12 = tag(a,'12–24 oy',560,1010);
  const b = makeBlock(sc.el,{hl:'PASPORT + KARTA', label:'faqat ikkita hujjat — shu yetarli', maxW:920, maxFont:200, labelFs:62});
  tl.fromTo(d,{scale:.2,opacity:0},{scale:1,opacity:1,duration:.6,ease:'power3.out'}, t0);
  tl.fromTo(pass,{x:-500,y:200,rotation:-40,opacity:0},{x:0,y:0,rotation:-9,opacity:1,duration:.7,ease:'expo.out'}, vs+.1);
  tl.fromTo(card,{x:600,y:300,rotation:35,opacity:0},{x:0,y:0,rotation:8,opacity:1,duration:.7,ease:'expo.out'}, vs+.7);
  tl.to(pass,{y:-14,rotation:-6,duration:1.4,yoyo:true,repeat:1,ease:'sine.inOut'}, vs+.9);
  tl.to(card,{y:12,rotation:5,duration:1.4,yoyo:true,repeat:1,ease:'sine.inOut'}, vs+1.4);
  tl.fromTo(t20,{scale:0,opacity:0},{scale:1,opacity:1,duration:.4,ease:'back.out(3)'}, vs+1.65);
  tl.fromTo(t12,{scale:0,opacity:0},{scale:1,opacity:1,duration:.4,ease:'back.out(3)'}, vs+1.9);
  blockIn(b, vs+.4, {stagger:.03, labelAt: vs+1.0});
}

/* S7 — "Sovg‘a! Har bir iPhone bilan chexol, oyna va zaryadka!" */
{
  const sc = SC[6], {t0, vs} = sc;
  const a = art(sc.el, true);
  const d = glowDisc(a, 130, 360, 820);
  const ph = mkPhone('p7', 390, 380, .98);
  const caseEl=el('div','glowsvg',`<svg viewBox="0 0 220 420" width="220" height="420"><rect x="4" y="4" width="212" height="412" rx="44" fill="rgba(34,153,245,.28)" stroke="#8fd3ff" stroke-width="6"/><rect x="22" y="22" width="92" height="92" rx="24" fill="none" stroke="#8fd3ff" stroke-width="5"/><circle cx="110" cy="320" r="26" fill="none" stroke="#8fd3ff" stroke-width="5"/></svg>`,{position:'absolute',left:'110px',top:'560px'});
  const glass=el('div','glowsvg',`<svg viewBox="0 0 220 420" width="220" height="420"><rect x="4" y="4" width="212" height="412" rx="38" fill="rgba(255,255,255,.08)" stroke="#fff" stroke-width="6"/><rect x="82" y="22" width="56" height="16" rx="8" fill="#fff" opacity=".9"/><path d="M40 330 L170 90" stroke="#fff" stroke-opacity=".5" stroke-width="18" stroke-linecap="round"/><path d="M70 372 L190 156" stroke="#fff" stroke-opacity=".3" stroke-width="10" stroke-linecap="round"/></svg>`,{position:'absolute',left:'760px',top:'520px'});
  const charger=el('div','glowsvg',`<svg viewBox="0 0 220 240" width="220" height="240"><rect x="52" y="60" width="116" height="148" rx="22" fill="#f1f4fa" stroke="#bcd8ff" stroke-width="4"/><rect x="78" y="22" width="14" height="40" rx="4" fill="#cfd6e4"/><rect x="128" y="22" width="14" height="40" rx="4" fill="#cfd6e4"/><circle cx="110" cy="134" r="20" fill="#2299F5"/><path d="M104 120 l-10 20 h12 l-4 18 14-24 h-12 l6-14z" fill="#fff"/></svg>`,{position:'absolute',left:'440px',top:'900px',transform:'scale(.78)',transformOrigin:'50% 0'});
  a.append(caseEl, glass, ph, charger);
  const ta = tag(a,'chexol',70,1010), tb = tag(a,'himoya oynasi',700,1000);
  const b = makeBlock(sc.el,{hl:'SOVG‘A!', label:'har bir iPhone bilan', sub:'chexol + himoya oynasi + zaryadka', maxW:900, maxFont:260, subFs:54});
  tl.fromTo(d,{scale:.2,opacity:0},{scale:1,opacity:1,duration:.6,ease:'power3.out'}, t0);
  tl.fromTo(ph,{y:500,rotationY:-60,opacity:0},{y:0,rotationY:-14,opacity:1,duration:.8,ease:'expo.out'}, t0+.05);
  tl.to(ph,{rotationY:16,y:-20,duration:4.0,ease:'sine.inOut'}, t0+.6);
  tl.fromTo(caseEl,{x:-500,rotation:-30,opacity:0},{x:0,rotation:-10,opacity:1,duration:.6,ease:'expo.out'}, vs+2.0);      // "chexol"
  tl.fromTo(glass,{x:500,rotation:30,opacity:0},{x:0,rotation:10,opacity:1,duration:.6,ease:'expo.out'}, vs+2.7);          // "oyna"
  tl.fromTo(charger,{y:400,scale:.3,opacity:0},{y:0,scale:.78,opacity:1,duration:.6,ease:'back.out(2)'}, vs+3.2);          // "zaryadka"
  [caseEl,glass,charger].forEach((e,i)=> tl.to(e,{y:'-=16',duration:1.1,yoyo:true,repeat:1,ease:'sine.inOut'}, vs+2.6+i*.4));
  tl.fromTo(ta,{scale:0},{scale:1,duration:.35,ease:'back.out(3)'}, vs+2.35);
  tl.fromTo(tb,{scale:0},{scale:1,duration:.35,ease:'back.out(3)'}, vs+3.05);
  blockIn(b, vs-.02, {labelAt: vs+1.0, subAt: vs+2.9});
}

/* S8 — "Orzu Mobile — ariza qoldiring!" */
ctaScene(SC[7], {label:'ariza qoldiring →', sub:'halol nasiya · butun O‘zbekistonga yetkazamiz'});
});
</script>
</body>
</html>
