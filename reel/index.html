<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Orzu Mobile — YO‘Q reel</title>
<style>
/* ===== Design tokens (sampled from the reference reels) ===== */
:root{
  --white:#FCFCFC;
  --label:#2299F5;      /* blue label box */
  --label-ink:#00021C;  /* text on label */
  --royal:#0039B8;      /* background mid blue */
  --royal-deep:#012992;
  --navy:#01091E;
  --ink:#000;
  --glow:#4DB8FF;       /* cyan neon glow */
  --glow2:#2399F4;
  --sub:#7CCBFF;        /* light-blue glow subtitle */
  /* Swap to 'Neue Machina' here when the font file is available */
  --font:'Bricolage',system-ui,sans-serif;
}
@font-face{font-family:'Bricolage';font-weight:200 800;font-stretch:75% 100%;
  src:url('node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2') format('woff2');}
@font-face{font-family:'Bricolage';font-weight:200 800;font-stretch:75% 100%;unicode-range:U+0100-02AF,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20CF,U+2113,U+2C60-2C7F,U+A720-A7FF;
  src:url('node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-ext-standard-normal.woff2') format('woff2');}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
body{font-family:var(--font);color:var(--white);font-variation-settings:'opsz' 14,'wdth' 100;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--navy)}

/* ===== Background ===== */
#bg{position:absolute;inset:0;
  background:
    radial-gradient(ellipse 900px 700px at var(--lx,50%) 38%, rgba(60,150,255,.55), transparent 70%),
    linear-gradient(180deg,#02081A 0%,#07226E 13%,#0039B8 30%,#0035AA 46%,#0A2A78 57%,#010B23 70%,#000 82%,#000 100%);}
#rings{position:absolute;left:50%;top:790px;width:0;height:0}
#rings i{position:absolute;left:0;top:0;border-radius:50%;border:5px solid rgba(110,190,255,.55);
  box-shadow:0 0 40px rgba(60,160,255,.6), inset 0 0 40px rgba(60,160,255,.35);transform:translate(-50%,-50%) scale(0);opacity:0}
#beams{position:absolute;inset:0;mix-blend-mode:screen;opacity:.55}
#beams i{position:absolute;top:-200px;width:260px;height:1500px;background:linear-gradient(180deg,rgba(120,200,255,.0),rgba(120,200,255,.55) 45%,rgba(120,200,255,0));filter:blur(46px);transform-origin:50% 0}
#grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background-size:256px 256px}
#vig{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 16%),
  linear-gradient(0deg,rgba(0,0,0,.92) 0,rgba(0,0,0,.65) 22%,rgba(0,0,0,0) 48%);pointer-events:none}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#bfe3ff,#2299F5 55%,transparent 80%);opacity:0;mix-blend-mode:screen}

/* ===== Scenes ===== */
.sc{position:absolute;inset:0;opacity:0;visibility:hidden}
.art{position:absolute;left:0;top:0;width:1080px;height:1500px;pointer-events:none}
.abs{position:absolute}

/* ===== Text block: headline + label ===== */
.txt{position:absolute;left:0;width:1080px;bottom:340px;display:flex;flex-direction:column;align-items:center}
.hl-wrap{position:relative;display:inline-block;white-space:nowrap;line-height:1}
.hl,.hlg{font-weight:800;text-transform:uppercase;letter-spacing:-.012em;line-height:.98;white-space:nowrap;font-variation-settings:'opsz' 12,'wdth' 100}
.hl{position:relative;color:var(--white);display:inline-block}
.hl .ch{display:inline-block;overflow:visible;will-change:transform}
.hlg{position:absolute;left:0;top:0;color:var(--glow);filter:blur(22px);opacity:.95;z-index:0}
.hl{z-index:1;text-shadow:0 0 10px rgba(120,210,255,.9),0 0 26px rgba(40,150,255,.65)}
.lab-wrap{margin-top:18px;overflow:hidden}
.lab{display:inline-block;background:var(--label);color:var(--label-ink);font-weight:500;font-size:76px;line-height:1.1;padding:12px 30px 14px;white-space:nowrap;font-variation-settings:'opsz' 14,'wdth' 100}
.gsub{margin-top:14px;text-align:center;font-weight:400;font-size:70px;line-height:1.1;color:var(--sub);
  text-shadow:0 0 14px rgba(77,184,255,.95),0 0 34px rgba(35,153,244,.7);font-variation-settings:'opsz' 14,'wdth' 100}
.gsub b{font-weight:700;color:#fff}

/* ===== Chrome (constant) ===== */
#chrome{position:absolute;inset:0;pointer-events:none}
#brandtl{position:absolute;left:92px;top:137px;font-weight:500;font-size:34px;line-height:1.18}
#pill{position:absolute;left:853px;top:106px;width:144px;height:56px;border:3px solid #fff;border-radius:30px;display:flex;align-items:center;justify-content:center}
/* Orzu Mobile logo: ring-O with pill, "RZU", gradient bar + "Mobile" */
#logo{position:absolute;right:61px;top:353px;width:316px}
#logo .row1{display:flex;align-items:center;justify-content:flex-end;gap:6px;height:84px}
#logo .rzu{font-weight:800;font-size:104px;line-height:1;letter-spacing:-.02em;font-variation-settings:'opsz' 12,'wdth' 100;margin-top:-2px}
#logo .row2{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-left:2px}
#logo .bar{display:block;width:172px;height:32px;border-radius:16px;background:linear-gradient(90deg,#DCEBFD 0%,#8EC5FF 42%,#5BB0FF 70%,#3F93F2 100%);box-shadow:0 0 16px rgba(80,170,255,.55)}
#logo .mob{font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-weight:400;font-size:42px;line-height:1;letter-spacing:-.02em;font-variation-settings:normal;margin-right:2px}
#disc{position:absolute;left:108px;width:864px;top:1806px;text-align:center;font-size:24px;font-weight:400;letter-spacing:.02em;color:rgba(255,255,255,.7);opacity:0}
.hair{position:absolute;left:108px;width:864px;height:3px;background:linear-gradient(90deg,rgba(58,155,255,0),#4DB8FF 14%,#4DB8FF 86%,rgba(58,155,255,0));box-shadow:0 0 14px rgba(77,184,255,.7)}
#hair1{top:1640px}#hair2{top:1775px;background:linear-gradient(90deg,rgba(35,130,255,0),#2a86ff 14%,#2a86ff 86%,rgba(35,130,255,0));box-shadow:0 0 14px rgba(42,134,255,.7)}
.frow{position:absolute;left:108px;width:864px;top:1690px;height:70px;display:flex;align-items:center;justify-content:space-between;font-size:26px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.88)}

/* ===== Phone ===== */
.phone{position:absolute;width:300px;height:620px;transform-style:preserve-3d}
.phone svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 30px 50px rgba(0,10,60,.7)) drop-shadow(0 0 36px rgba(60,160,255,.55))}
.persp{perspective:1600px}

/* icon discs */
.disc{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(70,170,255,.75),rgba(35,120,255,.25) 55%,transparent 72%);filter:blur(6px)}
.glowsvg{filter:drop-shadow(0 0 10px rgba(120,210,255,.95)) drop-shadow(0 0 28px rgba(35,153,245,.8))}

/* counter chip */
.chip{position:absolute;left:92px;top:262px;font-weight:700;font-size:40px;letter-spacing:.08em;color:var(--glow);text-shadow:0 0 16px rgba(77,184,255,.9)}
.chip em{font-style:normal;color:#fff;opacity:.55}

/* generic small tag */
.tag{position:absolute;background:var(--label);color:var(--label-ink);font-weight:500;font-size:40px;padding:6px 18px 8px;white-space:nowrap}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="beams"></div>
  <div id="rings"></div>
  <div id="grain"></div>

  <div id="vig"></div>
  <!-- scenes are injected by script -->
  <div id="scenes"></div>

  <div id="flash"></div>

  <div id="chrome">
    <div id="brandtl">Orzu<br>Mobile</div>
    <div id="pill"><svg width="64" height="22" viewBox="0 0 64 22" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 11h58M50 2l10 9-10 9"/></svg></div>
    <div id="logo">
      <div class="row1">
        <svg width="116" height="80" viewBox="0 0 116 80"><defs><linearGradient id="pg1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9AD2FF"/><stop offset="1" stop-color="#4DA5FF"/></linearGradient></defs>
          <rect x="7" y="7" width="102" height="66" rx="31" fill="none" stroke="#fff" stroke-width="14"/><rect x="34" y="32" width="48" height="16" rx="8" fill="url(#pg1)"/></svg>
        <span class="rzu">RZU</span>
      </div>
      <div class="row2"><i class="bar"></i><span class="mob">Mobile</span></div>
    </div>
    <div class="hair" id="hair1"></div>
    <div class="frow" id="frow1"><span>Orzu Mobile</span><span>(50)510-51-07</span><span>(95)592-90-90</span></div>
    <div class="hair" id="hair2"></div>
    <div id="disc">Yakuniy shartlar individual belgilanadi</div>
  </div>
</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
/* =====================================================================
   Orzu Mobile · "YO‘Q" reel · 1080×1920 · 20 s
   Timeline is fully deterministic: window.seek(t) renders any frame.
   ===================================================================== */
window.ready = (async () => {
await Promise.all([
  document.fonts.load("800 100px Bricolage"), document.fonts.load("700 100px Bricolage"),
  document.fonts.load("500 40px Bricolage"), document.fonts.load("400 40px Bricolage"),
]);
await document.fonts.ready;
const DURATION = 20;
const W = 1080;
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, cls, html, st) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html!=null) e.innerHTML = html; if (st) Object.assign(e.style, st); return e; };

/* ---------- noise texture ---------- */
(()=>{ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d'); const d=x.createImageData(256,256);
  let s=1234567; const r=()=> (s=(s*1664525+1013904223)>>>0)/4294967296;
  for(let i=0;i<d.data.length;i+=4){const v=r()*255|0; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255}
  x.putImageData(d,0,0); $('#grain').style.backgroundImage=`url(${c.toDataURL()})`; })();

/* ---------- background: beams + rings ---------- */
const beams=[]; for(let i=0;i<5;i++){ const b=el('i'); b.style.left=(60+i*220)+'px'; $('#beams').appendChild(b); beams.push(b); }
const rings=[]; for(let i=0;i<5;i++){ const r=el('i'); $('#rings').appendChild(r); rings.push(r); }
function updateBg(t){
  beams.forEach((b,i)=>{ const a=Math.sin(t*.55+i*1.7); b.style.transform=`rotate(${a*13+(i-2)*7}deg)`; b.style.opacity=.35+.35*Math.sin(t*.9+i*2.1)+.2; });
  $('#bg').style.setProperty('--lx', (50+Math.sin(t*.7)*10)+'%');
  rings.forEach((r,i)=>{ const p=((t*.42+i/5)%1); const s=.25+p*3.1; r.style.opacity=(1-p)*(p<.08?p/.08:1)*.9; r.style.width=r.style.height='520px';
    r.style.transform=`translate(-50%,-50%) scale(${s})`; r.style.borderWidth=(7*(1-p)+1)+'px'; });
}

/* ---------- reusable art ---------- */
function phoneSVG(id, tint){
  tint = tint || ['#E7E8EA','#9A9CA1'];
  return `<svg viewBox="0 0 300 620">
  <defs>
    <linearGradient id="${id}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${tint[0]}"/><stop offset=".55" stop-color="#B9BBC0"/><stop offset="1" stop-color="${tint[1]}"/></linearGradient>
    <linearGradient id="${id}r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#8d9096"/><stop offset="1" stop-color="#eceef1"/></linearGradient>
    <linearGradient id="${id}s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity=".0"/><stop offset="1" stop-color="#7cc4ff" stop-opacity=".25"/></linearGradient>
    <radialGradient id="${id}l" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#3b4a66"/><stop offset=".35" stop-color="#0b1220"/><stop offset="1" stop-color="#02050c"/></radialGradient>
    <linearGradient id="${id}p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d7d9dd"/><stop offset="1" stop-color="#9ea1a8"/></linearGradient>
  </defs>
  <rect x="-3" y="150" width="6" height="52" rx="3" fill="#8d9096"/><rect x="-3" y="222" width="6" height="86" rx="3" fill="#8d9096"/><rect x="-3" y="320" width="6" height="86" rx="3" fill="#8d9096"/><rect x="297" y="250" width="6" height="120" rx="3" fill="#8d9096"/>
  <rect x="0" y="0" width="300" height="620" rx="56" fill="url(#${id}r)"/>
  <rect x="5" y="5" width="290" height="610" rx="52" fill="url(#${id}b)"/>
  <rect x="5" y="5" width="290" height="610" rx="52" fill="url(#${id}s)"/>
  <rect x="22" y="22" width="136" height="136" rx="34" fill="url(#${id}p)" stroke="#f4f5f7" stroke-width="2"/>
  <g>
    <circle cx="62" cy="62" r="29" fill="#14161b" stroke="#c9ccd2" stroke-width="3"/><circle cx="62" cy="62" r="22" fill="url(#${id}l)"/><circle cx="55" cy="55" r="6" fill="#6f86b8" opacity=".6"/>
    <circle cx="62" cy="118" r="29" fill="#14161b" stroke="#c9ccd2" stroke-width="3"/><circle cx="62" cy="118" r="22" fill="url(#${id}l)"/><circle cx="55" cy="111" r="6" fill="#6f86b8" opacity=".6"/>
    <circle cx="118" cy="90" r="29" fill="#14161b" stroke="#c9ccd2" stroke-width="3"/><circle cx="118" cy="90" r="22" fill="url(#${id}l)"/><circle cx="111" cy="83" r="6" fill="#6f86b8" opacity=".6"/>
    <circle cx="130" cy="38" r="8" fill="#f2e7c9"/><circle cx="132" cy="140" r="6" fill="#111"/><circle cx="104" cy="40" r="4" fill="#222"/>
  </g>
  <path d="M60 560 Q150 585 240 560" stroke="#fff" stroke-opacity=".25" stroke-width="3" fill="none"/>
  </svg>`;
}
function mkPhone(id, x, y, scale, cls){
  const p = el('div','phone '+(cls||''), phoneSVG(id)); p.style.left=x+'px'; p.style.top=y+'px'; p.style.transform=`scale(${scale})`; p.style.transformOrigin='50% 50%'; return p;
}

/* line icons, 240×240 */
const ICON = {
  wallet:`<svg viewBox="0 0 240 240" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="62" width="196" height="132" rx="26"/><path d="M40 62 L168 30 Q184 26 186 44 L188 62"/><path d="M218 112 H166 a22 22 0 0 0 0 44 H218"/><circle cx="168" cy="134" r="5" fill="#fff"/></svg>`,
  percent:`<svg viewBox="0 0 240 240" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><circle cx="120" cy="120" r="96"/><circle cx="84" cy="88" r="17"/><circle cx="156" cy="152" r="17"/><path d="M164 74 L76 166"/></svg>`,
  calendar:`<svg viewBox="0 0 240 240" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><rect x="26" y="48" width="188" height="166" rx="26"/><path d="M26 98 H214M80 28 V66M160 28 V66"/><path d="M120 126 V164"/><circle cx="120" cy="188" r="4" fill="#fff"/></svg>`,
  cloud:`<svg viewBox="0 0 240 240" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M64 178 a46 46 0 0 1 -6 -91 a62 62 0 0 1 118 -10 a46 46 0 0 1 4 101 H110"/><rect x="104" y="140" width="76" height="58" rx="12" fill="rgba(0,57,184,.6)"/><path d="M122 140 v-16 a20 20 0 0 1 40 0 v16"/><circle cx="142" cy="170" r="5" fill="#fff"/></svg>`,
  box:`<svg viewBox="0 0 240 240" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M120 24 L210 66 V162 L120 214 L30 162 V66 Z"/><path d="M30 66 L120 108 L210 66M120 108 V214"/></svg>`,
};

/* passport + card */
function passportHTML(){ return `<svg viewBox="0 0 260 360" width="260" height="360">
 <defs><linearGradient id="pp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d3fae"/><stop offset="1" stop-color="#061a5c"/></linearGradient></defs>
 <rect x="4" y="4" width="252" height="352" rx="22" fill="url(#pp)" stroke="#6fb8ff" stroke-width="3"/>
 <g transform="translate(130 122)" fill="none" stroke="#9fd2ff" stroke-width="5"><circle r="52"/><ellipse rx="22" ry="52"/><path d="M-52 0H52M-44 -26H44M-44 26H44"/></g>
 <text x="130" y="238" text-anchor="middle" fill="#cfe8ff" font-size="28" font-weight="700" letter-spacing="5" style="font-family:var(--font)">PASPORT</text>
 <rect x="70" y="268" width="120" height="8" rx="4" fill="#4d8be6" opacity=".7"/><rect x="92" y="290" width="76" height="8" rx="4" fill="#4d8be6" opacity=".5"/></svg>`; }
function cardHTML(){ return `<svg viewBox="0 0 400 250" width="400" height="250">
 <defs><linearGradient id="cc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2a4d"/><stop offset="1" stop-color="#05091a"/></linearGradient><linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#d7b45a"/></linearGradient></defs>
 <rect x="3" y="3" width="394" height="244" rx="26" fill="url(#cc)" stroke="#6fb8ff" stroke-width="3"/>
 <rect x="36" y="64" width="62" height="48" rx="9" fill="url(#chip)"/><path d="M36 88H98M67 64V112" stroke="#9b7a22" stroke-width="2"/>
 <text x="36" y="170" fill="#e8f3ff" font-size="30" letter-spacing="4" style="font-family:var(--font);font-weight:500">•••• •••• •••• 0000</text>
 <text x="36" y="216" fill="#7fbfff" font-size="22" letter-spacing="3" style="font-family:var(--font);font-weight:600">PLASTIK KARTA</text>
 <circle cx="330" cy="206" r="22" fill="#2299F5" opacity=".9"/><circle cx="354" cy="206" r="22" fill="#fff" opacity=".7"/></svg>`; }

/* ---------- headline + label block ---------- */
function fitText(node, maxW, maxFont){
  let fs = maxFont; node.style.fontSize = fs+'px';
  const w = ()=> node.getBoundingClientRect().width;
  while (w() > maxW && fs > 40) { fs -= 4; node.style.fontSize = fs+'px'; }
  return fs;
}
function makeBlock(scene, o){
  const blk = el('div','txt');
  const wrap = el('div','hl-wrap');
  const hlg = el('div','hlg', o.hl);
  const hl = el('div','hl');
  [...o.hl].forEach(c=>{ const s=el('span','ch', c===' '?'&nbsp;':c); hl.appendChild(s); });
  wrap.appendChild(hlg); wrap.appendChild(hl);
  blk.appendChild(wrap);
  scene.appendChild(blk);
  const fs = fitText(hl, o.maxW||900, o.maxFont||250);
  hlg.style.fontSize = fs+'px';
  let lab=null, labWrap=null, gsub=null;
  if (o.label){ labWrap = el('div','lab-wrap'); lab = el('div','lab', o.label); labWrap.appendChild(lab); blk.appendChild(labWrap);
    if (o.labelFs){ lab.style.fontSize=o.labelFs+'px'; }
    // fit label inside 960px
    let f = parseInt(getComputedStyle(lab).fontSize); while (lab.getBoundingClientRect().width > 960 && f>34){ f-=2; lab.style.fontSize=f+'px'; } }
  if (o.sub){ gsub = el('div','gsub', o.sub); if (o.subFs) gsub.style.fontSize=o.subFs+'px'; gsub.style.maxWidth='940px'; blk.appendChild(gsub); }
  return {blk, wrap, hl, hlg, chars:[...hl.children], lab, labWrap, gsub};
}

/* =====================================================================
   Scenes
   ===================================================================== */
const scenesRoot = $('#scenes');
const mk = (id)=>{ const s=el('div','sc'); s.id=id; scenesRoot.appendChild(s); return s; };

const SC = [
  { id:'s1', t0:0,  t1:2.5 },
  { id:'s2', t0:2.5,t1:5.0 },
  { id:'s3', t0:5.0,t1:7.0 },
  { id:'s4', t0:7.0,t1:9.0 },
  { id:'s5', t0:9.0,t1:11.0 },
  { id:'s6', t0:11.0,t1:14.0 },
  { id:'s7', t0:14.0,t1:17.0 },
  { id:'s8', t0:17.0,t1:20.0 },
];
SC.forEach(s=>{ s.el = mk(s.id); });

/* ---- S1: hook ---- */
const s1 = SC[0].el; const a1 = el('div','art persp'); s1.appendChild(a1);
const ph1 = mkPhone('p1', 360, 330, 1.05); a1.appendChild(ph1);
const ph1b = mkPhone('p1b', 160, 600, .55); ph1b.style.opacity=.0; a1.appendChild(ph1b);
const d1 = el('div','disc',null,{left:'190px',top:'360px',width:'700px',height:'700px'}); a1.appendChild(d1);
const b1 = makeBlock(s1,{hl:'NASIYA', label:'yashirin to‘lovlar bormi?', maxW:900});

/* ---- S2–S5: four "YO‘Q" scenes ---- */
const NO = [
  { sc:SC[1], icon:'wallet',   label:'boshlang‘ich to‘lov', n:1 },
  { sc:SC[2], icon:'percent',  label:'foiz va ortiqcha to‘lov', n:2 },
  { sc:SC[3], icon:'calendar', label:'kechiksangiz jarima', n:3 },
  { sc:SC[4], icon:'cloud',    label:'iCloud bloklash', n:4 },
];
NO.forEach(o=>{
  const s=o.sc.el;
  const art=el('div','art'); s.appendChild(art);
  const disc=el('div','disc',null,{left:'170px',top:'380px',width:'740px',height:'740px'});
  const icon=el('div','glowsvg',ICON[o.icon],{position:'absolute',left:'290px',top:'500px',width:'500px',height:'500px'});
  const strike=el('div','glowsvg',`<svg viewBox="0 0 500 500" width="500" height="500"><path class="sl" d="M70 440 L430 60" stroke="#2299F5" stroke-width="30" stroke-linecap="round" fill="none"/><path class="sl2" d="M70 440 L430 60" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none" opacity=".9"/></svg>`,{position:'absolute',left:'290px',top:'500px',width:'500px',height:'500px'});
  const chip=el('div','chip', `0${o.n} <em>/ 04</em>`);
  art.append(disc,icon,strike,chip);
  o.disc=disc; o.icon_el=icon; o.strike=strike; o.chip=chip;
  o.blk = makeBlock(s,{hl:'YO‘Q!', label:o.label, maxW:900, maxFont:290});
});

/* ---- S6: pasport + karta ---- */
const s6=SC[5].el; const a6=el('div','art'); s6.appendChild(a6);
const d6=el('div','disc',null,{left:'140px',top:'420px',width:'800px',height:'800px'});
const pass=el('div','glowsvg',passportHTML(),{position:'absolute',left:'210px',top:'470px',width:'260px',height:'360px',transformOrigin:'50% 100%'});
const card=el('div','glowsvg',cardHTML(),{position:'absolute',left:'430px',top:'660px',width:'400px',height:'250px',transformOrigin:'0 100%'});
const plus=el('div','glowsvg',`<svg viewBox="0 0 100 100" width="100" height="100"><path d="M50 12V88M12 50H88" stroke="#fff" stroke-width="14" stroke-linecap="round"/></svg>`,{position:'absolute',left:'420px',top:'1010px',width:'100px',height:'100px'});
const tag20=el('div','tag','20 yoshdan',{left:'250px',top:'1010px'});
const tag12=el('div','tag','12–24 oy',{left:'560px',top:'1010px'});

plus.remove();
const b6=makeBlock(s6,{hl:'PASPORT + KARTA', label:'faqat ikkita hujjat — shu yetarli', maxW:920, maxFont:200, labelFs:62});

/* ---- S7: bonus kit ---- */
const s7=SC[6].el; const a7=el('div','art persp'); s7.appendChild(a7);
const d7=el('div','disc',null,{left:'130px',top:'360px',width:'820px',height:'820px'});
const ph7=mkPhone('p7', 370, 380, .98);
/* case */
const caseEl=el('div','glowsvg',`<svg viewBox="0 0 220 420" width="220" height="420"><rect x="4" y="4" width="212" height="412" rx="44" fill="rgba(34,153,245,.28)" stroke="#8fd3ff" stroke-width="6"/><rect x="22" y="22" width="92" height="92" rx="24" fill="none" stroke="#8fd3ff" stroke-width="5"/><circle cx="110" cy="320" r="26" fill="none" stroke="#8fd3ff" stroke-width="5"/></svg>`,{position:'absolute',left:'110px',top:'560px'});
/* screen protector */
const glass=el('div','glowsvg',`<svg viewBox="0 0 220 420" width="220" height="420"><rect x="4" y="4" width="212" height="412" rx="38" fill="rgba(255,255,255,.08)" stroke="#fff" stroke-width="6"/><rect x="82" y="22" width="56" height="16" rx="8" fill="#fff" opacity=".9"/><path d="M40 330 L170 90" stroke="#fff" stroke-opacity=".5" stroke-width="18" stroke-linecap="round"/><path d="M70 372 L190 156" stroke="#fff" stroke-opacity=".3" stroke-width="10" stroke-linecap="round"/></svg>`,{position:'absolute',left:'760px',top:'520px'});
/* charger */
const charger=el('div','glowsvg',`<svg viewBox="0 0 220 240" width="220" height="240"><rect x="52" y="60" width="116" height="148" rx="22" fill="#f1f4fa" stroke="#bcd8ff" stroke-width="4"/><rect x="78" y="22" width="14" height="40" rx="4" fill="#cfd6e4"/><rect x="128" y="22" width="14" height="40" rx="4" fill="#cfd6e4"/><circle cx="110" cy="134" r="20" fill="#2299F5"/><path d="M104 120 l-10 20 h12 l-4 18 14-24 h-12 l6-14z" fill="#fff"/></svg>`,{position:'absolute',left:'440px',top:'900px',transform:'scale(.78)',transformOrigin:'50% 0'});
const t7a=el('div','tag','chexol',{left:'70px',top:'1010px'});
const t7b=el('div','tag','himoya oynasi',{left:'700px',top:'1000px'});
const t7c=el('div','tag','zaryadka bloki',{left:'400px',top:'1300px'}); t7c.style.display='none';
a7.append(d7,caseEl,glass,ph7,charger,t7a,t7b);
const b7=makeBlock(s7,{hl:'SOVG‘A!', label:'har bir iPhone bilan', sub:'chexol + himoya oynasi + zaryadka', maxW:900, maxFont:260, subFs:54});

/* ---- S8: CTA ---- */
const s8=SC[7].el; const a8=el('div','art persp'); s8.appendChild(a8);
const d8=el('div','disc',null,{left:'120px',top:'330px',width:'840px',height:'840px'});
const ph8=mkPhone('p8', 350, 340, 1.1);
const spk=[]; for(let i=0;i<14;i++){ const a=el('div','abs',null,{left:'540px',top:'700px',width:(8+(i%3)*5)+'px',height:(8+(i%3)*5)+'px',borderRadius:'50%',background:i%2?'#fff':'#4DB8FF',boxShadow:'0 0 18px #4DB8FF'}); a8.appendChild(a); spk.push(a); }
a8.append(d8,ph8);
const b8=makeBlock(s8,{hl:'ORZU MOBILE', label:'ariza qoldiring →', sub:'halol nasiya · butun O‘zbekistonga yetkazamiz', maxW:940, maxFont:230, subFs:42});

/* =====================================================================
   Timeline
   ===================================================================== */
const tl = gsap.timeline({paused:true});
const flash = $('#flash');

/* cut flash on each scene start */
SC.forEach((s,i)=>{
  if(i===0) return;
  tl.fromTo(flash,{opacity:0},{opacity:.55,duration:.06,ease:'power2.out'}, s.t0)
    .to(flash,{opacity:0,duration:.28,ease:'power2.in'}, s.t0+.06);
});

/* scene visibility with quick scale-out */
SC.forEach((s,i)=>{
  tl.set(s.el,{autoAlpha:1,scale:1}, s.t0);
  if(i<SC.length-1){
    tl.to(s.el,{scale:1.06,duration:.12,ease:'power1.in'}, s.t1-.12);
    tl.set(s.el,{autoAlpha:0}, s.t1);
  }
});
tl.set(SC[0].el,{autoAlpha:1},0);

/* helper: text block in */
function blockIn(b, t, opts={}){
  const stg = opts.stagger ?? .045;
  tl.fromTo(b.chars,{yPercent:115,rotation:6,scale:.7,opacity:0},{yPercent:0,rotation:0,scale:1,opacity:1,duration:.5,ease:'back.out(2.2)',stagger:stg,transformOrigin:'50% 80%'}, t);
  tl.fromTo(b.hlg,{opacity:0},{opacity:.95,duration:.45,ease:'power2.out'}, t+.1);
  tl.fromTo(b.hlg,{scale:1},{scale:1.03,duration:.5,yoyo:true,repeat:3,ease:'sine.inOut',transformOrigin:'50% 50%'}, t+.5);
  if(b.labWrap){
    tl.fromTo(b.lab,{xPercent:-105},{xPercent:0,duration:.38,ease:'expo.out'}, t+.28);
  }
  if(b.gsub){
    tl.fromTo(b.gsub,{opacity:0,y:30,scale:.94},{opacity:1,y:0,scale:1,duration:.5,ease:'power3.out'}, t+(b.labWrap?.5:.3));
  }
}
function blockOut(b, t){
  tl.to([b.wrap,b.labWrap,b.gsub].filter(Boolean),{opacity:0,y:-20,duration:.12,ease:'power1.in'}, t);
}

/* S1 */
{
  const t=0;
  tl.fromTo(ph1,{y:420,rotationY:-70,rotationZ:-24,scale:.6,opacity:0},{y:0,rotationY:-16,rotationZ:-10,scale:1.05,opacity:1,duration:1.0,ease:'expo.out'}, t+.05);
  tl.to(ph1,{rotationY:22,rotationZ:9,y:-26,duration:2.1,ease:'sine.inOut'}, t+.5);
  tl.fromTo(d1,{scale:.3,opacity:0},{scale:1,opacity:1,duration:.9,ease:'power3.out'}, t+.05);
  blockIn(b1, t+.35);
}
/* S2..S5 */
NO.forEach((o,i)=>{
  const t=o.sc.t0;
  tl.fromTo(o.disc,{scale:.2,opacity:0},{scale:1,opacity:1,duration:.5,ease:'power3.out'}, t);
  tl.fromTo(o.icon_el,{scale:.2,rotation:-25,opacity:0},{scale:1,rotation:0,opacity:1,duration:.5,ease:'back.out(2.4)'}, t+.04);
  tl.to(o.icon_el,{y:-16,duration:.9,yoyo:true,repeat:1,ease:'sine.inOut'}, t+.5);
  tl.fromTo(o.chip,{x:-60,opacity:0},{x:0,opacity:1,duration:.4,ease:'power3.out'}, t+.08);
  const sl=o.strike.querySelector('.sl'), sl2=o.strike.querySelector('.sl2');
  [sl,sl2].forEach(p=>{ const L=p.getTotalLength(); gsap.set(p,{strokeDasharray:L,strokeDashoffset:L}); tl.to(p,{strokeDashoffset:0,duration:.18,ease:'power3.in'}, t+.62); });
  tl.fromTo(o.icon_el,{opacity:1},{opacity:.35,duration:.2}, t+.74);
  tl.fromTo(o.strike,{scale:1.18},{scale:1,duration:.22,ease:'back.out(3)'}, t+.78);
  // YO'Q slam
  blockIn(o.blk, t+.78, {stagger:.06});
  tl.fromTo(o.blk.wrap,{scale:1.35},{scale:1,duration:.22,ease:'power4.out',transformOrigin:'50% 70%'}, t+.78);
});
/* S6 */
{
  const t=SC[5].t0;
  tl.fromTo(d6,{scale:.2,opacity:0},{scale:1,opacity:1,duration:.6,ease:'power3.out'}, t);
  tl.fromTo(pass,{x:-500,y:200,rotation:-40,opacity:0},{x:0,y:0,rotation:-9,opacity:1,duration:.7,ease:'expo.out'}, t+.05);
  tl.fromTo(card,{x:600,y:300,rotation:35,opacity:0},{x:0,y:0,rotation:8,opacity:1,duration:.7,ease:'expo.out'}, t+.2);
  tl.to(pass,{y:-14,rotation:-6,duration:1.2,yoyo:true,repeat:1,ease:'sine.inOut'}, t+.9);
  tl.to(card,{y:12,rotation:5,duration:1.2,yoyo:true,repeat:1,ease:'sine.inOut'}, t+.9);
  tl.fromTo(tag20,{scale:0,opacity:0},{scale:1,opacity:1,duration:.4,ease:'back.out(3)'}, t+1.5);
  tl.fromTo(tag12,{scale:0,opacity:0},{scale:1,opacity:1,duration:.4,ease:'back.out(3)'}, t+1.7);
  blockIn(b6, t+.3, {stagger:.03});
}
/* S7 */
{
  const t=SC[6].t0;
  tl.fromTo(d7,{scale:.2,opacity:0},{scale:1,opacity:1,duration:.6,ease:'power3.out'}, t);
  tl.fromTo(ph7,{y:500,rotationY:-60,opacity:0},{y:0,rotationY:-14,opacity:1,duration:.8,ease:'expo.out'}, t+.05);
  tl.to(ph7,{rotationY:16,y:-20,duration:2.4,ease:'sine.inOut'}, t+.6);
  tl.fromTo(caseEl,{x:-500,rotation:-30,opacity:0},{x:0,rotation:-10,opacity:1,duration:.7,ease:'expo.out'}, t+.5);
  tl.fromTo(glass,{x:500,rotation:30,opacity:0},{x:0,rotation:10,opacity:1,duration:.7,ease:'expo.out'}, t+.8);
  tl.fromTo(charger,{y:400,scale:.3,opacity:0},{y:0,scale:.78,opacity:1,duration:.7,ease:'back.out(2)'}, t+1.1);
  [caseEl,glass,charger].forEach((e,i)=> tl.to(e,{y:'-=16',duration:1.1,yoyo:true,repeat:1,ease:'sine.inOut'}, t+1.4+i*.1));
  tl.fromTo(t7a,{scale:0},{scale:1,duration:.35,ease:'back.out(3)'}, t+.95);
  tl.fromTo(t7b,{scale:0},{scale:1,duration:.35,ease:'back.out(3)'}, t+1.25);
  blockIn(b7, t+.3);
}
/* S8 */
{
  const t=SC[7].t0;
  tl.fromTo(d8,{scale:.2,opacity:0},{scale:1,opacity:1,duration:.7,ease:'power3.out'}, t);
  tl.fromTo(ph8,{y:520,rotationY:-80,rotationZ:-18,opacity:0,scale:.7},{y:0,rotationY:-12,rotationZ:-4,opacity:1,scale:1.1,duration:1,ease:'expo.out'}, t+.05);
  tl.to(ph8,{rotationY:14,rotationZ:4,y:-24,duration:2.2,ease:'sine.inOut'}, t+.7);
  spk.forEach((s,i)=>{ const a=(i/spk.length)*Math.PI*2+.3, r=330+(i%4)*70;
    tl.fromTo(s,{x:0,y:0,opacity:0,scale:.2},{x:Math.cos(a)*r,y:Math.sin(a)*r*.9,opacity:1,scale:1,duration:.5,ease:'power3.out'}, t+.4)
      .to(s,{opacity:0,y:'+=60',duration:.7,ease:'power1.in'}, t+.9); });
  blockIn(b8, t+.5, {stagger:.035});
  // fine print under the footer on the CTA scene
  tl.fromTo('#disc',{opacity:0},{opacity:.75,duration:.4,ease:'power2.out'}, t+.7);
}

/* make sure every scene's elements start hidden before first tween (GSAP "fromTo" handles it) */

/* global renderer hook */
window.DURATION = DURATION;
window.seek = (t)=>{ tl.time(Math.min(Math.max(t,0),DURATION),false); updateBg(t); };
window.seek(0);
return true;
})();
</script>
